name: Offline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock pytest pip-audit
      - run: pip check
      - run: python -m pytest tests -q
      - run: python -m pip_audit --no-deps --disable-pip -r requirements.lock
